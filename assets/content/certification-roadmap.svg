<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">AWS certification learning roadmap illustration</title>
  <desc id="desc">A structured learning path connects study, labs, certification milestones, and applied cloud troubleshooting.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#12345c"/></linearGradient><linearGradient id="medal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd166"/><stop offset="1" stop-color="#ff9900"/></linearGradient></defs>
  <rect width="800" height="450" rx="30" fill="url(#bg)"/>
  <g opacity=".1" stroke="#91c5ff"><path d="M0 90h800M0 180h800M0 270h800M0 360h800"/><path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450"/></g>
  <path d="M90 320C190 180 270 330 372 202S566 112 710 190" fill="none" stroke="#345b86" stroke-width="12" stroke-linecap="round"/>
  <path d="M90 320C190 180 270 330 372 202S566 112 710 190" fill="none" stroke="#75b6ff" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif"><g transform="translate(58 270)"><circle cx="48" cy="48" r="48" fill="#0d213a" stroke="#4c8bd7"/><path d="M25 43h46M25 58h35" stroke="#91c5ff" stroke-width="8" stroke-linecap="round"/><text x="48" y="119" fill="#dcecff" font-size="17" font-weight="700" text-anchor="middle">study</text></g>
  <g transform="translate(240 218)"><circle cx="48" cy="48" r="48" fill="#0d213a" stroke="#4c8bd7"/><path d="M29 30h38v38H29z" fill="#2474e5"/><path d="M39 20v15M57 20v15M39 63v15M57 63v15M20 39h15M20 57h15M63 39h15M63 57h15" stroke="#dcecff" stroke-width="4" stroke-linecap="round"/><text x="48" y="119" fill="#dcecff" font-size="17" font-weight="700" text-anchor="middle">labs</text></g>
  <g transform="translate(412 112)"><path d="M48 2l18 29 34 8-23 26 3 35-32-14-32 14 3-35L-4 39l34-8z" fill="url(#medal)"/><circle cx="48" cy="51" r="22" fill="#fff" opacity=".92"/><path d="M38 51l7 7 14-18" stroke="#12345c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="129" fill="#dcecff" font-size="17" font-weight="700" text-anchor="middle">certify</text></g>
  <g transform="translate(616 133)"><circle cx="48" cy="48" r="48" fill="#0d213a" stroke="#34d399"/><path d="M25 52l15 15 31-38" stroke="#34d399" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="119" fill="#dcecff" font-size="17" font-weight="700" text-anchor="middle">apply</text></g></g>
  <g fill="#91c5ff" font-family="Arial,sans-serif" font-size="15"><text x="65" y="72">the loop repeats</text><text x="65" y="97">read → build → break → verify → explain</text></g>
  <rect x="533" y="300" width="190" height="58" rx="18" fill="#0d213a" stroke="#ff9900"/><text x="628" y="326" fill="#ffbe62" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">two AWS certifications</text><text x="628" y="347" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">during the internship</text>
</svg>
