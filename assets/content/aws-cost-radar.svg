  <g transform="translate(90 92)"><circle cx="140" cy="140" r="106" fill="#081729" stroke="#345b86" stroke-width="3"/><path d="M66 172a92 92 0 1 1 148 0" fill="none" stroke="#1f4f83" stroke-width="20" stroke-linecap="round"/><path d="M66 172a92 92 0 0 1 112-116" fill="none" stroke="#34d399" stroke-width="20" stroke-linecap="round"/><path d="M178 56a92 92 0 0 1 56 116" fill="none" stroke="#ff9900" stroke-width="20" stroke-linecap="round"/><path d="M140 140l62-55" stroke="#dcecff" stroke-width="7" stroke-linecap="round"/><circle cx="140" cy="140" r="12" fill="#2474e5"/><text x="140" y="209" fill="#dcecff" font-size="24" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700">budget radar</text></g>
