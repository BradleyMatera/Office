  <rect width="800" height="450" rx="30" fill="url(#bg)"/>
  <g opacity=".1" stroke="#91c5ff"><path d="M0 90h800M0 180h800M0 270h800M0 360h800"/><path d="M160 0v450M320 0v450M480 0v450M640 0v450"/></g>
