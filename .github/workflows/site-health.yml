name: Monitor GitHub Pages Health

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-health
  cancel-in-progress: true

jobs:
  check-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://bradleymatera.github.io/Office

    steps:
      - name: Check critical public resources
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/"
            "/writing.html"
            "/proof.html"
            "/sources.html"
            "/styles.css"
            "/hub.css"
            "/assets/og/aws-metadata-workflow.png"
            "/sitemap.xml"
            "/robots.txt"
            "/rss.xml"
            "/llms.txt"
          )

          for path in "${paths[@]}"; do
            echo "Checking ${BASE_URL}${path}"
            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 4 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 45 \
              --output /dev/null \
              "${BASE_URL}${path}"
          done

      - name: Verify page identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --location --retry 4 --retry-all-errors "${BASE_URL}/" | grep -F "When a file is uploaded to Amazon S3"
          curl --fail --silent --location --retry 4 --retry-all-errors "${BASE_URL}/writing.html" | grep -F "AWS articles and internship notes"
          curl --fail --silent --location --retry 4 --retry-all-errors "${BASE_URL}/proof.html" | grep -F "Project evidence"
          curl --fail --silent --location --retry 4 --retry-all-errors "${BASE_URL}/sources.html" | grep -F "AWS documentation references"

      - name: Verify social image content type
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --head \
            "${BASE_URL}/assets/og/aws-metadata-workflow.png" \
            | tr -d '\r' \
            | grep -i '^content-type: image/png'
